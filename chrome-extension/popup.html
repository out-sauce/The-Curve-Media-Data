<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; width: 420px; margin: 14px; color: #111; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      .domain { font-weight: 700; word-break: break-all; }
      label { display: block; margin: 12px 0 4px; font-size: 12px; color: #555; }
      input { width: 100%; padding: 6px; box-sizing: border-box; font: inherit; }
      button { margin-top: 14px; width: 100%; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 12px; font-size: 13px; white-space: pre-wrap; max-height: 260px; overflow-y: auto; overscroll-behavior: contain; }
      .ok { color: #137333; }
      .err { color: #c5221f; }
      a { color: #1a73e8; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Capture auth for The Curve</h1>
    <div>Site: <span class="domain" id="domain">…</span></div>

    <button id="capture" disabled>Capture &amp; send</button>
    <button id="sendArticle" disabled>Send article content</button>

    <!-- Shown only on creators.spotify.com / podcasters.spotify.com -->
    <div id="podcastSection" style="display: none">
      <button id="sendPodcast" disabled>Send podcast stats</button>
      <label for="podcastLookback">Episodes per run</label>
      <select id="podcastLookback">
        <option value="10">Most recent 10</option>
        <option value="25">Most recent 25</option>
        <option value="50">Most recent 50</option>
      </select>
      <div style="margin-top: 6px; font-size: 12px">
        <a id="podcastBackfill">Full backfill (every episode — slow)</a>
      </div>
    </div>

    <div id="status"></div>

    <script src="spotify-collector.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
